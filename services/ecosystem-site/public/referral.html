<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 Miau Finance — Invite Only (For Now)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05080a;color:#c8d6d0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
.card{background:linear-gradient(135deg,rgba(0,255,136,0.03),rgba(0,170,255,0.03));border:1px solid rgba(0,255,136,0.1);border-radius:24px;padding:60px 40px;max-width:500px;width:90%;text-align:center;position:relative}
.card::before{content:'🐱';position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:60px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
h1{font-size:28px;font-weight:800;margin:20px 0 8px;background:linear-gradient(135deg,#00ff88,#00ddff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
p{color:rgba(200,214,208,0.5);font-size:14px;line-height:1.7;margin-bottom:30px}
.code{background:rgba(0,0,0,0.4);border:1px solid rgba(0,255,136,0.15);border-radius:12px;padding:20px;font-family:monospace;font-size:13px;color:#00ff88;margin-bottom:30px;position:relative;cursor:pointer;transition:all 0.3s}
.code:hover{border-color:rgba(0,255,136,0.3);background:rgba(0,0,0,0.5)}
.code .label{font-size:10px;color:rgba(200,214,208,0.3);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.code .value{font-size:18px;font-weight:700;letter-spacing:1px}
.code .copied{font-size:11px;color:#00ff88;opacity:0;transition:opacity 0.3s;margin-top:8px}
.code .copied.show{opacity:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s;border:none;background:linear-gradient(135deg,#00ff88,#00dd77);color:#05080a;box-shadow:0 4px 20px rgba(0,255,136,0.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,255,136,0.4)}
.features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.features span{padding:6px 14px;border-radius:100px;font-size:12px;border:1px solid rgba(0,255,136,0.1);color:rgba(200,214,208,0.4)}
.cat{margin-top:40px;font-size:32px;opacity:0.3}
</style>
</head>
<body>
<div class="card">
  <h1>You've Been Invited</h1>
  <p>Miau Finance is the Bloomberg Terminal for the rest of us.<br>
  No $24k/year subscription. No suit required. Just cats and charts.</p>
  
  <div class="code" onclick="copyCode()">
    <div class="label">Your invite code</div>
    <div class="value" id="inviteCode">MIAU-CAT-2026</div>
    <div class="copied" id="copiedMsg">✅ Copied! Share it with a friend.</div>
  </div>

  <button class="btn" onclick="window.open('http://localhost:5173','_blank')">🐱 Launch Terminal →</button>

  <div class="features">
    <span>📈 3D Charts</span>
    <span>🤖 AI Advisor</span>
    <span>🐱 Cat Mode</span>
    <span>💰 Free</span>
  </div>

  <div class="cat">🐱</div>
</div>

<script>
function copyCode() {
  const code = document.getElementById('inviteCode').textContent
  navigator.clipboard.writeText(code)
  document.getElementById('copiedMsg').classList.add('show')
  setTimeout(() => document.getElementById('copiedMsg').classList.remove('show'), 2000)
}
</script>
</body>
</html>
