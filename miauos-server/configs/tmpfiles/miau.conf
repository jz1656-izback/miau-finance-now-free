# MiauOS tmpfiles.d — Runtime Directory and File Management
# Type  Path                    Mode    UID     GID     Age     Argument

# CatPod runtime directories
d       /run/catpod             0750    miau    miau    -       -
d       /run/catpod/sockets     0750    miau    miau    -       -
d       /run/catpod/locks       0750    miau    miau    -       -

# CatNet state directory
d       /run/catnet             0750    catnet  catnet  -       -

# Log directories
d       /var/log/catpod         0750    miau    miau    30d     -
d       /var/log/catnet         0750    catnet  catnet  30d     -
d       /var/log/miauos         0750    miau    miau    90d     -

# Data directories
d       /var/lib/catpod         0750    miau    miau    -       -
d       /var/lib/catpod/data    0700    miau    miau    -       -
d       /var/lib/catpod/config  0750    miau    miau    -       -

# Temporary files — cleaned on boot
D       /tmp/miauos             1777    root    root    10d     -
D       /tmp/catpod             1777    miau    miau    1d      -

# Immutable root marker
f       /etc/miauos-immutable   0444    root    root    -       "MiauOS Immutable Root — DO NOT MODIFY"
