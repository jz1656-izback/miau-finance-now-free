name: Test

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miau
          POSTGRES_PASSWORD: miau_dev_password
          POSTGRES_DB: miau
        ports:
          - 5434:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -e "backend/[dev]"
      - run: pip install pytest pytest-asyncio pytest-httpx coverage
      - run: DATABASE_URL=postgresql+asyncpg://miau:miau_dev_password@localhost:5434/miau python -m pytest backend/tests/ -v --timeout=30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npx vitest run --coverage 2>/dev/null || echo "no vitest config"

  education:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd apps/education-platform && npm ci
      - run: cd apps/education-platform && npx tsc --noEmit
