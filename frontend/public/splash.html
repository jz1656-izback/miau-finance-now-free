<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1a14" />
  <title>Miau Finance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0a1a14;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      text-align: center;
      animation: fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .logo {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 20px rgba(0, 255, 136, 0.3));
    }
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      margin-bottom: 24px;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 255, 136, 0.15);
      border-top-color: #00ff88;
      border-right-color: rgba(0, 255, 136, 0.4);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
      .splash { animation: none; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">🐱</div>
    <div class="title">MIAU FINANCE</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
