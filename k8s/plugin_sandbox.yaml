apiVersion: v1
kind: Namespace
metadata:
  name: miau-plugin-sandbox
---
apiVersion: v1
kind: Pod
metadata:
  name: plugin-sandbox
  namespace: miau-plugin-sandbox
spec:
  # 🔒 SECURITY (V7-005): sandbox must be maximally restricted
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: sandbox
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      privileged: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      limits:
        cpu: "500m"
        memory: "256Mi"
