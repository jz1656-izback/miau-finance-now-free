[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that need external services",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/middleware/crypto/*",
    "*/__pycache__/*",
    "*/alembic/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
