[package]
name = "miau_analytics"
version = "0.1.0"
edition = "2021"
description = "Rust-accelerated analytics engine for Miau Finance"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py38"] }
numpy = "0.23"
ndarray = "0.16"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
